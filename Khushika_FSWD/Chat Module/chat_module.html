<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Khushika's Bot</title>

<style>
/* (NO CHANGE — your CSS is perfect, keeping same) */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; background: #1c1c1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

.device {
  width: 390px;
  background: #000;
  border-radius: 50px;
  padding: 14px;
  box-shadow: 0 0 0 1px #3a3a3c, 0 30px 80px rgba(0,0,0,0.8), inset 0 0 0 1px #2c2c2e;
  position: relative;
}

.screen {
  background: #000;
  border-radius: 40px;
  overflow: hidden;
  height: 680px;
  display: flex;
  flex-direction: column;
  position: relative;
}

.dynamic-island {
  position: absolute;
  top: 12px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 34px;
  background: #000;
  border-radius: 20px;
}

.status-bar {
  padding: 18px 24px 6px;
  display: flex;
  justify-content: space-between;
  color: #fff;
  font-size: 15px;
  padding-top: 54px;
}

.chat-header {
  background: rgba(28,28,30,0.92);
  padding: 8px 16px 12px;
  display: flex;
  align-items: center;
  border-bottom: 0.5px solid rgba(255,255,255,0.1);
}

.header-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.bot-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: linear-gradient(145deg, #5e5ce6, #bf5af2);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

.header-name { font-size: 16px; font-weight: 600; color: #fff; }
.header-sub { font-size: 12px; color: #34c759; }

.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.msg-group { margin-bottom: 6px; }
.bubble {
  max-width: 75%;
  padding: 10px 14px;
  font-size: 16px;
  border-radius: 18px;
}

.received .bubble { background: #1c1c1e; color: #fff; }
.sent .bubble { background: #007aff; color: #fff; }

.chat-footer {
  padding: 10px;
  display: flex;
  gap: 8px;
}

.msg-input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
}
</style>
</head>

<body>

<div class="device">
<div class="screen">

<div class="status-bar">
<span>9:41</span>
<span>🔋</span>
</div>

<div class="chat-header">
<div class="header-center">
<div class="bot-avatar">🤖</div>
<div class="header-name">Khushika's Bot</div>
<div class="header-sub">● Online</div>
</div>
</div>

<div class="chat-body" id="chatBody">

<div class="msg-group received">
<div class="bubble">Hey there! 👋 I'm Khushika's Bot.</div>
<div class="bubble">How can I help you today? 😊</div>
</div>

<div class="msg-group sent">
<div class="bubble">Hey bot! What can you do? 🤔</div>
</div>

<div class="msg-group received">
<div class="bubble">I can chat, answer questions, and keep you company! 🚀✨</div>
</div>

</div>

<div class="chat-footer">
<input class="msg-input" id="msgInput" placeholder="Type message..."/>
<button onclick="sendMsg()">Send</button>
</div>

</div>
</div>

<script>
const chatBody = document.getElementById('chatBody');

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  const msg = document.createElement('div');
  msg.className = 'msg-group sent';
  msg.innerHTML = `<div class="bubble">${text}</div>`;
  chatBody.appendChild(msg);

  input.value = '';

  setTimeout(() => {
    const reply = document.createElement('div');
    reply.className = 'msg-group received';
    reply.innerHTML = `<div class="bubble">Nice! 😄</div>`;
    chatBody.appendChild(reply);
    chatBody.scrollTop = chatBody.scrollHeight;
  }, 800);
}
</script>

</body>
</html>
